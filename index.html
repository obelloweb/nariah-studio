<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nariah Studio · Elevated Power for Modern Women</title>
<link rel="icon" href="fotos/logo--monograma-n-transparente.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Prata&amp;family=Lora:ital,wght@0,400..600;1,400..600&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#FAF8F5;color:#181615;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#4A332D}a:hover{color:#36231E}
img{display:block}
.hero p.lead,.sec-head p,.about-body p,.pull p,.lovers-card p,.info .desc,.guide p,.soldout{text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:6 3 3;text-wrap:pretty;word-spacing:-.01em}
button{font-family:inherit;color:inherit}
.serif{font-family:'Lora',Georgia,serif}
.wrap{width:100%;max-width:1360px;margin:0 auto;padding-left:32px;padding-right:32px}
.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:#4A332D}
.section{scroll-margin-top:110px;padding-top:112px;padding-bottom:112px}
.divider{display:flex;align-items:center;gap:28px}
.divider span{flex:1;height:1px;background:linear-gradient(90deg,rgba(230,223,213,0),#E6DFD5 30%,#E6DFD5 70%,rgba(230,223,213,0))}
.divider img{height:22px;width:auto;opacity:.5}
.ease{transition-timing-function:cubic-bezier(.16,1,.3,1)}

/* pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:0 30px;border-radius:999px;font-size:14px;font-weight:500;letter-spacing:.05em;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:background .4s cubic-bezier(.16,1,.3,1),color .4s cubic-bezier(.16,1,.3,1),border-color .4s cubic-bezier(.16,1,.3,1),transform .4s cubic-bezier(.16,1,.3,1)}
.btn svg{transition:transform .5s cubic-bezier(.16,1,.3,1)}
.btn:hover svg{transform:translateX(4px)}
.btn--down:hover svg{transform:translateY(3px)}
.btn--primary{background:#4A332D;color:#FAF8F5}
.btn--primary:hover{background:#36231E;color:#FAF8F5}
.btn--ghost{background:transparent;color:#181615;border-color:rgba(24,22,21,.22)}
.btn--ghost:hover{background:#181615;color:#FAF8F5;border-color:#181615}
.btn--block{width:100%}
.pill{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:999px;background:#F3E9D2;color:#4A332D;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}

/* header */
.header{position:sticky;top:0;z-index:40;padding:14px 20px 0}
.header-pill{max-width:1320px;margin:0 auto;height:66px;border-radius:999px;background:rgba(250,248,245,.52);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.55);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 30px -18px rgba(74,51,45,.35);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:0 10px 0 24px}
.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#181615}
.brand:hover{color:#181615}
.mono{height:36px;width:auto;flex:none}
.word{display:flex;flex-direction:column;line-height:1}
.word b{font-family:'Prata',Georgia,serif;font-weight:400;font-size:18px;letter-spacing:.26em}
.word small{font-size:9px;letter-spacing:.42em;margin-top:4px;color:#4A332D}
.nav{display:flex;gap:6px;justify-content:center}
.nav a{font-size:13px;letter-spacing:.06em;color:#181615;text-decoration:none;padding:10px 16px;border-radius:999px;transition:background .4s cubic-bezier(.16,1,.3,1)}
.nav a:hover{background:rgba(243,233,210,.8);color:#181615}
.head-actions{display:flex;justify-content:flex-end;gap:6px}
.hpill{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;font-size:13px;color:#181615;text-decoration:none;transition:background .4s cubic-bezier(.16,1,.3,1),color .4s cubic-bezier(.16,1,.3,1)}
.hpill:hover{background:rgba(243,233,210,.8);color:#181615}
.hpill--dark{background:#4A332D;color:#FAF8F5}
.hpill--dark:hover{background:#36231E;color:#FAF8F5}
.icon-btn{width:46px;height:46px;border-radius:999px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#181615;text-decoration:none;transition:background .4s cubic-bezier(.16,1,.3,1)}
.icon-btn:hover{background:rgba(243,233,210,.8);color:#181615}
.icon-btn--glass{background:rgba(255,255,255,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.only-mobile{display:none}

/* hero */
.hero{min-height:88svh;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:64px;align-items:center;padding-top:40px;padding-bottom:72px}
.hero h1{font-family:'Lora',Georgia,serif;font-weight:400;font-size:clamp(40px,4.5vw,72px);line-height:1.04;letter-spacing:-.015em;margin:28px 0 32px}
.hero h1 em{font-style:italic;font-weight:400;color:#4A332D;display:block}
.hero p.lead{font-size:18px;line-height:1.75;color:#4f4744;max-width:440px;margin:0 0 44px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero-media{position:relative;height:min(80svh,820px);min-height:520px}
.hero-photo{position:absolute;inset:0;overflow:hidden;border-radius:320px 320px 32px 32px;background:#EEE8E0}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 72%;transform:scale(1.16);transform-origin:46% 66%}
.hero-chip{position:absolute;left:24px;bottom:24px;display:inline-flex;align-items:center;gap:14px;padding:10px 10px 10px 20px;border-radius:999px;border:0;background:rgba(255,255,255,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;font-size:13px;color:#181615;text-align:left}
.hero-chip b{font-family:'Lora',Georgia,serif;font-weight:500;font-size:16px;display:block}
.hero-chip small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#4A332D;margin-bottom:2px}
.hero-chip span.go{width:40px;height:40px;border-radius:999px;background:#4A332D;color:#FAF8F5;display:inline-flex;align-items:center;justify-content:center;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.hero-chip:hover span.go{transform:translateX(3px)}

/* marquee */
.marquee{overflow:hidden;padding:26px 0;background:#F3E9D2}
.marquee-track{display:flex;width:max-content;animation:marquee 60s linear infinite}
.marquee-track span{font-family:'Lora',Georgia,serif;font-weight:400;font-size:24px;letter-spacing:.01em;white-space:nowrap;padding:0 36px;color:#181615}
.marquee-track em{color:#4A332D}
.marquee-track i{font-style:normal;color:#B8957A;font-size:12px;display:flex;align-items:center}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marquee-track{animation:none}}

/* section heads */
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:52px}
.sec-head h2{font-family:'Lora',Georgia,serif;font-weight:400;font-size:46px;line-height:1.12;margin:18px 0 0;max-width:620px}
.sec-head h2 em{color:#4A332D}
.sec-head p{max-width:380px;margin:0;font-size:16px;line-height:1.75;color:#5a514d}

/* product cards: no boxes */
.pcard{display:flex;flex-direction:column;gap:18px;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.pcard-media{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:16px;background:#EFE9E1;transform:translateZ(0)}
.pcard-zoom{position:absolute;inset:0;transition:transform .7s cubic-bezier(.16,1,.3,1)}
.pcard:hover .pcard-zoom{transform:scale(1.05)}
.pcard-media img{position:absolute;max-width:none}
.pcard-media img.fill,.stage img.fill{left:-8%;top:-8%;width:116%;height:116%;object-fit:cover;filter:blur(28px) saturate(.9);transition:none}
.pcard-media .pill{position:absolute;top:14px;left:14px}
.pcard-info{display:flex;flex-direction:column;gap:12px;padding:0 4px}
.pcard-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pcard-name{font-family:'Lora',Georgia,serif;font-size:19px;line-height:1.25}
.pcard-price{font-size:14px;letter-spacing:.02em;color:#4f4744;white-space:nowrap}
.dots{display:flex;gap:9px;align-items:center}
.dot{width:12px;height:12px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(24,22,21,.14);position:relative;flex:none}
.dot--off::after{content:'';position:absolute;left:-2px;right:-2px;top:50%;height:1px;background:#181615;transform:rotate(-45deg)}

/* highlights: asymmetric */
.highlights{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:start}
.hl-big .pcard-name{font-size:30px}
.hl-big .pcard-price{font-size:16px}
.hl-big .pcard-media{border-radius:24px}
.hl-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 24px}
.hl-side > *:nth-child(even){margin-top:72px}
.hl-note{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-top:8px;font-size:15px;color:#5a514d}

/* catalog */
.filters{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 8px;margin-bottom:56px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;height:46px;padding:0 22px;border-radius:999px;border:1px solid rgba(230,223,213,.9);background:transparent;font-size:13px;letter-spacing:.04em;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:#181615;transition:background .4s cubic-bezier(.16,1,.3,1),color .4s cubic-bezier(.16,1,.3,1),border-color .4s cubic-bezier(.16,1,.3,1)}
.chip:hover{background:#F3E9D2;border-color:#F3E9D2}
.chip sup{font-size:10px;color:#8a817c;top:0}
.chip--on{background:#4A332D;border-color:#4A332D;color:#FAF8F5}
.chip--on:hover{background:#36231E;border-color:#36231E}
.chip--on sup{color:#E6DFD5}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:60px 28px}
.catalog-foot{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:72px;font-size:14px;color:#5a514d;flex-wrap:wrap}

/* about */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:120px;align-items:start}
.about-photo{position:sticky;top:120px}
.about-frame{position:relative;padding:14px}
.about-frame::before{content:'';position:absolute;inset:0;border-radius:36px;box-shadow:inset 0 0 0 1px rgba(74,51,45,.18);pointer-events:none}
.about-img{aspect-ratio:4/5;overflow:hidden;border-radius:24px;background:#EFE9E1}
.about-img img{width:100%;height:100%;object-fit:cover;object-position:14% 50%}
.about-caption{display:flex;justify-content:space-between;gap:16px;margin-top:20px;padding:0 14px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6b615c}
.about h2{font-family:'Lora',Georgia,serif;font-weight:400;font-size:48px;line-height:1.14;letter-spacing:-.01em;margin:22px 0 56px}
.about-body p{font-size:17px;line-height:1.95;color:#2e2826;margin:0 0 30px;max-width:600px}
.pull{background:#F3E9D2;padding:44px 48px;margin:56px 0;border-radius:16px}
.pull p{font-family:'Lora',Georgia,serif;font-style:italic;font-size:23px;line-height:1.55;color:#181615;margin:0;max-width:none}
.sign{margin-top:56px}
.sign .serif{font-size:26px;font-style:italic}
.sign small{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#4A332D;margin-top:8px}

/* lovers banner */
.lovers-card{background:#F3E9D2;border-radius:32px;padding:68px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:72px;align-items:center}
.lovers-card h2{font-family:'Lora',Georgia,serif;font-weight:400;font-size:72px;line-height:1.02;letter-spacing:-.015em;margin:20px 0 28px}
.lovers-card h2 em{font-style:italic;color:#4A332D}
.lovers-card p{font-size:17px;line-height:1.75;color:#3d3633;max-width:500px;margin:0 0 36px}
.perks{list-style:none;padding:0;margin:0 0 48px;display:flex;flex-direction:column;gap:16px;max-width:500px}
.perks li{display:flex;gap:16px;align-items:center;font-size:15px;color:#2e2826}
.perks span.ic{width:40px;height:40px;border-radius:999px;background:rgba(250,248,245,.75);display:inline-flex;align-items:center;justify-content:center;color:#4A332D;flex:none}
.lovers-photo{aspect-ratio:4/5;overflow:hidden;border-radius:24px}
.lovers-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 100%;transform:translateX(-5.6%) scale(1.12);transform-origin:50% 85%}

/* footer */
.footer{padding-top:92px;padding-bottom:44px}
.footer-in{display:flex;flex-direction:column;align-items:center;text-align:center}
.footer-logo{height:84px;width:auto}
.footer-tag{font-family:'Lora',Georgia,serif;font-weight:400;font-style:italic;font-size:22px;color:#4A332D;margin:24px 0 40px}
.footer-links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.footer-links .btn{min-height:62px;padding:0 34px;font-size:15px}
.btn--ig{background:#181615;color:#FAF8F5}
.btn--ig:hover{background:#000;color:#FAF8F5}
.btn--vip{background:#F3E9D2;color:#4A332D}
.btn--vip:hover{background:#EADBB8;color:#36231E}
.footer-nav{display:flex;gap:8px 28px;flex-wrap:wrap;justify-content:center;margin-top:56px}
.footer-nav a{font-size:13px;letter-spacing:.06em;color:#4f4744;text-decoration:none;padding:8px 0}
.footer-nav a:hover{color:#4A332D;text-decoration:underline;text-underline-offset:5px}
.footer-base{margin-top:72px;font-size:12px;color:#8a817c;letter-spacing:.04em}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(24,22,21,.4);z-index:80;animation:fade .4s ease}
.drawer{position:fixed;top:16px;right:16px;bottom:16px;width:min(1100px,calc(100% - 32px));background:#FAF8F5;z-index:90;overflow-y:auto;border-radius:28px;animation:slideIn .5s var(--ease-drawer);box-shadow:0 30px 80px rgba(24,22,21,.18)}
.drawer-top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 20px 16px 32px;background:rgba(250,248,245,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.grab{display:none}
.crumb{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#6b615c}
.pdp{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:56px;padding:8px 40px 56px}
.gal{display:grid;grid-template-columns:68px minmax(0,1fr);gap:16px;align-items:start}
.thumbs{display:flex;flex-direction:column;gap:10px}
.thumb{width:68px;aspect-ratio:2/3;overflow:hidden;border:0;padding:0;background:#EFE9E1;cursor:pointer;border-radius:12px;opacity:.55;transition:opacity .4s ease,box-shadow .4s ease}
.thumb:hover{opacity:1}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb--on{opacity:1;box-shadow:0 0 0 2px #FAF8F5,0 0 0 3px #4A332D}
.stage{position:relative;aspect-ratio:2/3;overflow:hidden;background:#EFE9E1;border-radius:24px;transform:translateZ(0)}
.stage img{position:absolute;max-width:none;transition:left .9s cubic-bezier(.16,1,.3,1),top .9s cubic-bezier(.16,1,.3,1),width .9s cubic-bezier(.16,1,.3,1),height .9s cubic-bezier(.16,1,.3,1)}
.glass{background:rgba(255,255,255,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.stage-toggle{position:absolute;left:16px;bottom:16px;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:0;font-size:12px;letter-spacing:.08em;cursor:pointer;color:#181615;transition:background .4s ease}
.stage-toggle:hover{background:rgba(255,255,255,.95)}
.stage-nav{position:absolute;right:16px;bottom:16px;display:flex;gap:8px}
.stage-nav button{width:44px;height:44px;border-radius:999px;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#181615}
.stage-nav button:hover{background:rgba(255,255,255,.95)}
.stage-note{position:absolute;top:16px;left:16px;right:16px;font-size:11px;letter-spacing:.04em;padding:10px 16px;border-radius:999px;text-align:center}
.info{display:flex;flex-direction:column;gap:32px;padding-top:12px}
.info h2{font-family:'Lora',Georgia,serif;font-weight:400;font-size:44px;line-height:1.08;margin:14px 0 14px}
.info .price{font-size:19px;font-weight:500}
.info .desc{font-size:16px;line-height:1.8;color:#3d3633;margin:0}
.opt-label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;letter-spacing:.04em;margin-bottom:14px;color:#4f4744}
.opt-label b{font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:#181615}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(24,22,21,.16);position:relative;transition:box-shadow .3s ease;display:block}
.swatch-wrap{width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;padding:0;cursor:pointer;border-radius:99px}
.swatch--on{box-shadow:inset 0 0 0 1px rgba(24,22,21,.16),0 0 0 3px #FAF8F5,0 0 0 4px #4A332D}
.swatch--off::after{content:'';position:absolute;left:-3px;right:-3px;top:50%;height:1px;background:#181615;transform:rotate(-45deg)}
.sizes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.size{height:50px;border:1px solid rgba(217,208,196,.9);background:transparent;border-radius:999px;font-size:14px;letter-spacing:.04em;cursor:pointer;transition:all .35s cubic-bezier(.16,1,.3,1)}
.size:hover{border-color:#4A332D}
.size--on{background:#4A332D;color:#FAF8F5;border-color:#4A332D}
.size--off{color:#A39A92;cursor:not-allowed;background:linear-gradient(to top right,transparent calc(50% - .6px),#CFC5B9 50%,transparent calc(50% + .6px)),#F3EEE7;border-color:transparent}
.size--off:hover{border-color:transparent}
.link-btn{background:none;border:0;padding:6px 0;font-size:13px;text-decoration:underline;text-underline-offset:5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#181615;min-height:36px}
.link-btn:hover{color:#4A332D}
.guide{border-radius:16px;padding:22px 24px;background:#F5EFE3;animation:fade .4s ease}
.guide table{width:100%;border-collapse:collapse;font-size:14px}
.guide th{font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#4A332D;text-align:left;padding:0 8px 12px 0}
.guide td{padding:10px 8px 10px 0;border-top:1px solid rgba(74,51,45,.08)}
.guide p{font-size:12px;color:#6b615c;margin:14px 0 0;line-height:1.6}
.alert{font-size:13px;color:#8a4a3e;margin:12px 0 0}
.soldout{background:#F3E9D2;padding:18px 22px;border-radius:16px;font-size:14px;line-height:1.65}
.buy-note{font-size:12px;color:#6b615c;text-align:center;margin:14px 0 0}
.details{display:flex;flex-direction:column;gap:12px}
.details div{display:flex;gap:14px;align-items:center;font-size:14px;color:#4f4744}
.details span.ic{width:36px;height:36px;border-radius:999px;background:#F3E9D2;display:inline-flex;align-items:center;justify-content:center;color:#4A332D;flex:none}

.menu{position:fixed;top:12px;left:12px;bottom:12px;width:min(86vw,380px);background:#FAF8F5;z-index:90;display:flex;flex-direction:column;border-radius:28px;animation:slideLeft .5s cubic-bezier(.16,1,.3,1);box-shadow:0 30px 80px rgba(24,22,21,.18)}
.menu-top{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 16px 24px}
.menu-links{margin-top:auto;padding:24px 24px 8px;display:flex;flex-direction:column;gap:4px}
.menu-links a{font-family:'Lora',Georgia,serif;font-size:28px;line-height:1.1;color:#181615;text-decoration:none;padding:14px 0;display:flex;justify-content:space-between;align-items:center}
.menu-links a:hover{color:#4A332D}
.menu-cta{padding:16px 20px 24px;display:flex;flex-direction:column;gap:10px}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideUp{from{transform:translateY(56px);opacity:0}to{transform:none;opacity:1}}

@media (max-width:960px){
  .nav,.hpill{display:none}
  .only-mobile{display:inline-flex}
  .header{padding:10px 12px 0}
  .header-pill{height:60px;padding:0 6px 0 16px;gap:8px;grid-template-columns:auto 1fr}
  .head-actions{gap:4px}
  .section{padding-top:80px;padding-bottom:80px}
  .hero{grid-template-columns:minmax(0,1fr);gap:28px;min-height:0;padding-top:20px;padding-bottom:48px}
  .hero-media{order:-1;height:auto;min-height:0;aspect-ratio:4/5}
  .hero-photo{border-radius:220px 220px 28px 28px}
  .highlights{grid-template-columns:minmax(0,1fr);gap:40px}
  .hl-side{gap:48px 16px}
  .hl-side > *:nth-child(even){margin-top:28px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 16px}
  .grid > :last-child:nth-child(odd){grid-column:1 / -1;justify-self:center;width:calc(50% - 8px)}
  .about{grid-template-columns:minmax(0,1fr);gap:36px}
  .about-photo{position:static;max-width:460px}
  .lovers-card{grid-template-columns:minmax(0,1fr)}
  .lovers-photo{order:-1;aspect-ratio:4/5}
  .lovers-photo img{object-position:50% 100%;transform:scale(1.12);transform-origin:57% 62%}
  .drawer{top:24px;left:0;right:0;bottom:0;width:100%;border-radius:28px 28px 0 0;animation:slideUp .5s var(--ease-drawer)}
  .grab{display:block;position:absolute;left:50%;top:6px;width:40px;height:4px;border-radius:9px;background:#D9D0C4;transform:translateX(-50%)}
  .drawer-top{padding:16px 12px 12px 24px}
  .pdp{grid-template-columns:minmax(0,1fr)}
  .gal{grid-template-columns:minmax(0,1fr)}
  .thumbs{flex-direction:row;order:2;overflow-x:auto;padding:4px}
  .thumb{width:60px;flex:none}
}
@media (max-width:600px){
  .wrap{padding-left:20px;padding-right:20px}
  .section{padding-top:60px;padding-bottom:60px}
  .footer{padding-top:64px}
  .catalog-foot{margin-top:44px}
  .hl-side{gap:32px 12px}
  .hero h1{font-size:min(42px,10vw);margin:20px 0 22px}
  .hero p.lead{font-size:16px;margin-bottom:32px}
  .hero-ctas .btn{flex:1 1 100%}
  .lovers-card{gap:28px}
  .hero-chip{left:14px;bottom:14px;padding:8px 8px 8px 16px}
  .marquee{padding:22px 0}
  .marquee-track span{font-size:18px;padding:0 22px}
  .sec-head{margin-bottom:30px;gap:16px}
  #colecao-title{font-size:min(34px,7.4vw)}
  .sec-head h2{font-size:34px}
  .hl-big .pcard-name{font-size:24px}
  .pcard-name{font-size:16px}
  .pcard-price{font-size:13px}
  .pcard-row{flex-direction:column;gap:4px}
  .pcard-media{border-radius:14px}
  .pcard-media .pill{top:10px;left:10px;height:24px;padding:0 10px;font-size:9px}
  .grid{gap:32px 12px}
  .grid > :last-child:nth-child(odd){width:calc(50% - 6px)}
  .filters{margin-bottom:28px}
  .about h2{font-size:34px;margin-bottom:26px}
  .about-body p{margin-bottom:22px}
  .pull{margin:36px 0}
  .about-body p{font-size:16px}
  .pull{padding:30px 26px}
  .pull p{font-size:19px}
  .lovers-card{padding:28px 22px 36px;border-radius:28px}
  .lovers-card h2{font-size:46px}
  .footer-tag{font-size:19px;margin:18px 0 28px}
  .footer-nav{flex-wrap:nowrap;gap:0 12px;margin-top:36px}
  .footer-nav a{font-size:11.5px;letter-spacing:.02em;white-space:nowrap}
  .footer-base{margin-top:40px}
  .giant{margin-top:48px}
  .size-cta{width:100%;gap:14px}
  .size-cta b{font-size:16px}
  .size-cta .ico{width:46px;height:46px}
  .footer-links .btn{flex:1 1 100%}
  .info h2{font-size:36px}
  .pdp{padding:4px 16px 40px}
  .sizes{gap:6px}
}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div style="min-height: 100vh; background: #FAF8F5">

  <header class="header">
    <div class="header-pill">
      <div style="display: flex; align-items: center; gap: 4px">
        <a class="brand" href="#topo" aria-label="Nariah Studio, início">
          <img class="mono" src="fotos/logo--monograma-n-transparente.png" alt="">
          <span class="word"><b>NARIAH</b><small>STUDIO</small></span>
        </a>
      </div>
      <nav class="nav" aria-label="Navegação principal">
        <a href="#colecao">Coleção</a>
        <a href="#catalogo">Catálogo</a>
        <a href="#sobre">Sobre a Nariah</a>
        <a href="#lovers">Nariah Lovers</a>
      </nav>
      <div class="head-actions">
        <a class="hpill" href="https://www.instagram.com/nariahstudio" target="_blank" rel="noopener noreferrer">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.4"></rect><circle cx="12" cy="12" r="4.6"></circle><circle cx="17.6" cy="6.4" r="1.25" fill="currentColor" stroke="none"></circle></svg>
          Nosso Instagram
        </a>
        <a class="hpill hpill--dark" href="https://wa.me/5521968653459" target="_blank" rel="noopener noreferrer">
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8a9.2 9.2 0 0 0-7.9 13.9L2.8 21.2l4.6-1.2A9.2 9.2 0 1 0 12 2.8z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"></path><path transform="translate(6.9 6.9) scale(.44)" fill="currentColor" d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"></path></svg>
          Fale conosco
        </a>
        <a class="icon-btn only-mobile" href="https://www.instagram.com/nariahstudio" target="_blank" rel="noopener noreferrer" aria-label="Nosso Instagram @nariahstudio">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.4"></rect><circle cx="12" cy="12" r="4.6"></circle><circle cx="17.6" cy="6.4" r="1.25" fill="currentColor" stroke="none"></circle></svg>
        </a>
        <a class="icon-btn only-mobile" href="https://wa.me/5521968653459" target="_blank" rel="noopener noreferrer" aria-label="Falar no WhatsApp" style="background: #4A332D; color: #FAF8F5">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8a9.2 9.2 0 0 0-7.9 13.9L2.8 21.2l4.6-1.2A9.2 9.2 0 1 0 12 2.8z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"></path><path transform="translate(6.9 6.9) scale(.44)" fill="currentColor" d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"></path></svg>
        </a>
        <button class="icon-btn bag-btn" type="button" aria-label="{{ sc.aria }}" onClick="{{ openBag }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 8h13l-1 12.5h-11z"></path><path d="M9 10.5V7a3 3 0 0 1 6 0v3.5"></path></svg>
          <template data-if="{{ sc.temQtd }}"><span class="bag-count" style="animation-name: {{ sc.anim }}">{{ sc.qtd }}</span></template>
        </button>
          <button class="icon-btn only-mobile" type="button" aria-label="Abrir menu" onClick="{{ openMenu }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h10"></path></svg>
          </button>
      </div>
    </div>
  </header>

  <main id="topo">

    <section class="wrap hero" aria-labelledby="hero-title">
      <div>
        <div class="eyebrow">Moda fitness feminina · Rio de Janeiro</div>
        <h1 id="hero-title"><span class="ln"><span>Elevated <b>Power</b></span></span><span class="ln"><em>for Modern <b>Women</b>.</em></span></h1>
        <p class="lead">Do primeiro agachamento ao café depois do treino, uma peça só. Firme quando você se move, macia quando você desacelera e bonita o dia inteiro, dentro e fora da academia.</p>
        <div class="hero-ctas">
          <a class="btn btn--primary btn--down" href="#catalogo">
            Conhecer a coleção
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg>
          </a>
        </div>
      </div>
      <div class="hero-media">
        <div class="hero-photo">
          <div class="hero-par"><img src="fotos/hero--macacao-reto-azul-bebe.jpg" alt="Modelo sentada em um cubo branco vestindo o Macacão Reto na cor Azul Bebê"></div>
        </div>
        <button class="hero-chip" type="button" onClick="{{ openIcon }}">
          <span><small>Na foto</small><b>Macacão Reto</b></span>
          <span class="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
        </button>
      </div>
    </section>

    <div class="wrap" aria-hidden="true"><div class="divider"><span></span><img src="fotos/logo--monograma-n-transparente.png" alt=""><span></span></div></div>

    <section id="colecao" class="wrap section" aria-labelledby="colecao-title">
      <div class="sec-head">
        <div>
          <div class="eyebrow"><span class="idx">01</span>Destaques da coleção</div>
          <h2 id="colecao-title">Feita para o treino.<em style="display: block">Pensada para depois dele.</em></h2>
        </div>
        <p>Cada peça nasceu para um momento do seu dia: o treino que pede firmeza, a corrida que pede liberdade e o depois, quando você só quer continuar se sentindo bem vestida. Os tons conversam entre si, então tudo combina com tudo.</p>
      </div>

      <div class="highlights">
        <div class="hl-big">
          <button class="pcard" type="button" onClick="{{ hlGrande.open }}" aria-label="{{ hlGrande.aria }}">
            <div class="pcard-media">
              <div class="pcard-zoom">
                <img class="fill" src="{{ hlGrande.capa }}" alt="" aria-hidden="true">
                <img src="{{ hlGrande.capa }}" alt="{{ hlGrande.alt }}" style="left: {{ hlGrande.l }}; top: {{ hlGrande.t }}; width: {{ hlGrande.w }}; height: {{ hlGrande.h }}">
                <div class="alt" aria-hidden="true"><img class="fill" src="{{ hlGrande.capa2 }}" alt=""><img src="{{ hlGrande.capa2 }}" alt="" style="left: {{ hlGrande.l2 }}; top: {{ hlGrande.t2 }}; width: {{ hlGrande.w2 }}; height: {{ hlGrande.h2 }}"></div>
              </div>
              <span class="pill">{{ hlGrande.categoria }}</span>
            </div>
            <div class="pcard-info">
              <div class="pcard-row"><span class="pcard-name">{{ hlGrande.nome }}</span><span class="pcard-price">{{ hlGrande.precoFmt }}</span></div>
              <div class="dots">
                <template data-for="{{ hlGrande.dots }}" data-as="d">
                  <span class="{{ d.cls }}" style="background: {{ d.hex }}" title="{{ d.title }}"></span>
                </template>
              </div>
            </div>
          </button>
        </div>
        <div class="hl-side">
          <template data-for="{{ hlCuradas }}" data-as="c">
            <button class="pcard" type="button" onClick="{{ c.open }}" aria-label="{{ c.aria }}">
              <div class="pcard-media">
                <div class="pcard-zoom">
                  <img class="fill" src="{{ c.capa }}" alt="" aria-hidden="true">
                  <img src="{{ c.capa }}" alt="{{ c.alt }}" style="left: {{ c.l }}; top: {{ c.t }}; width: {{ c.w }}; height: {{ c.h }}">
                <div class="alt" aria-hidden="true"><img class="fill" src="{{ c.capa2 }}" alt=""><img src="{{ c.capa2 }}" alt="" style="left: {{ c.l2 }}; top: {{ c.t2 }}; width: {{ c.w2 }}; height: {{ c.h2 }}"></div>
                </div>
                <span class="pill">{{ c.categoria }}</span>
              </div>
              <div class="pcard-info">
                <div class="pcard-row"><span class="pcard-name">{{ c.nome }}</span><span class="pcard-price">{{ c.precoFmt }}</span></div>
                <div class="dots">
                  <template data-for="{{ c.dots }}" data-as="d">
                    <span class="{{ d.cls }}" style="background: {{ d.hex }}" title="{{ d.title }}"></span>
                  </template>
                </div>
              </div>
            </button>
          </template>
        </div>
      </div>
    </section>

    <div class="wrap" aria-hidden="true"><div class="divider"><span></span><img src="fotos/logo--monograma-n-transparente.png" alt=""><span></span></div></div>

    <section id="catalogo" class="wrap section" aria-labelledby="catalogo-title">
      <div class="sec-head">
        <div>
          <div class="eyebrow"><span class="idx">02</span>Catálogo</div>
          <h2 id="catalogo-title">A peça que faltava <em>no seu treino.</em></h2>
        </div>
        <p>Toque em qualquer peça para ver de perto e escolher cor e tamanho. Seu pedido já vai pronto para o WhatsApp, e quem responde é a nossa equipe, não um robô.</p>
      </div>

      <div class="filters" role="toolbar" aria-label="Filtrar por categoria">
        <template data-for="{{ filtros }}" data-as="f">
          <button class="{{ f.cls }}" type="button" aria-pressed="{{ f.sel }}" onClick="{{ f.pick }}">{{ f.label }}<sup>{{ f.qtd }}</sup></button>
        </template>
      </div>

      <div class="grid">
        <template data-for="{{ catalogo }}" data-as="c">
          <button class="pcard" type="button" onClick="{{ c.open }}" aria-label="{{ c.aria }}">
            <div class="pcard-media">
              <template data-if="{{ c.temBadge }}"><span class="{{ c.badgeCls }}">{{ c.badge }}</span></template>
              <div class="pcard-zoom">
                <img class="fill" src="{{ c.capa }}" alt="" aria-hidden="true">
                <img src="{{ c.capa }}" alt="{{ c.alt }}" style="left: {{ c.l }}; top: {{ c.t }}; width: {{ c.w }}; height: {{ c.h }}">
                <div class="alt" aria-hidden="true"><img class="fill" src="{{ c.capa2 }}" alt=""><img src="{{ c.capa2 }}" alt="" style="left: {{ c.l2 }}; top: {{ c.t2 }}; width: {{ c.w2 }}; height: {{ c.h2 }}"></div>
              </div>
            </div>
            <div class="pcard-info">
              <div class="pcard-row"><span class="pcard-name">{{ c.nome }}</span><span class="pcard-price">{{ c.precoFmt }}</span></div>
              <div class="dots">
                <template data-for="{{ c.dots }}" data-as="d">
                  <span class="{{ d.cls }}" style="background: {{ d.hex }}" title="{{ d.title }}"></span>
                </template>
              </div>
            </div>
          </button>
        </template>
      </div>

      <div class="catalog-foot">
        <a class="size-cta" href="https://wa.me/5521968653459?text=Ol%C3%A1%2C%20fiquei%20em%20d%C3%BAvida%20entre%20dois%20tamanhos.%20Pode%20me%20ajudar%3F" target="_blank" rel="noopener noreferrer">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15.5 15.5 3l5.5 5.5L8.5 21z"></path><path d="M7 12l2 2M10 9l2 2M13 6l2 2"></path></svg></span>
          <span class="txt"><small>Ajuda com tamanhos</small><b>Em dúvida entre dois tamanhos? A gente ajuda</b></span>
          <span class="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
        </a>
      </div>
    </section>

    <div class="wrap" aria-hidden="true"><div class="divider"><span></span><img src="fotos/logo--monograma-n-transparente.png" alt=""><span></span></div></div>

    <section id="sobre" class="wrap section" aria-labelledby="sobre-title">
      <div class="about">
        <div class="about-photo">
          <div class="about-frame">
            <div class="about-img">
              <img src="fotos/sobre--nathalia-2.jpg" alt="Nathalia Lagoia, fundadora da Nariah Studio, sentada no chão do estúdio vestindo um macacão na cor Cacao">
            </div>
          </div>
          <div class="about-caption"><span>Nathalia Lagoia</span><span>Rio de Janeiro</span></div>
        </div>
        <div class="about-body">
          <div class="eyebrow"><span class="idx">03</span>Sobre a Nariah</div>
          <h2 id="sobre-title">A Nariah nasceu de uma transformação que começou em mim.</h2>
          <p>Sou Nathalia Lagoia, fundadora da Nariah Studio, paraense de Belém, mãe do Leon e do Noah e hoje moradora do Rio de Janeiro. Durante 12 anos, minha vida profissional foi no mar, onde construí minha trajetória como oficial da Marinha Mercante e cheguei ao posto de imediata.</p>
          <p>Com a maternidade e as mudanças da vida, também fui descobrindo novas versões de mim. Em uma dessas fases, transformei meus hábitos, emagreci 30 quilos e encontrei na musculação e na corrida um espaço de cuidado, disciplina e superação. Nesse processo, recuperei a confiança e descobri o prazer de me sentir forte.</p>
          <p>A Nariah nasceu dessa vivência e de uma vontade muito pessoal de vestir peças que acompanhassem meu movimento, valorizassem meu corpo e combinassem com meu estilo. Roupas que eu amasse usar no treino e quisesse continuar vestindo depois dele.</p>
          <p>Hoje, essa intenção orienta cada escolha da marca. Busco unir conforto, cortes que valorizam e uma estética elegante em peças que façam parte da vida de mulheres com diferentes rotinas e histórias.</p>
          <p>Uma das minhas maiores alegrias é ver a Nariah em vocês. Nos treinos, nas corridas, nos encontros e nas pequenas conquistas do dia a dia. Ver uma mulher vestir uma peça e se sentir bonita e confiante dá sentido ao que estou construindo.</p>
          <blockquote class="pull" style="margin-left: 0; margin-right: 0">
            <p>“Elevated Power for Modern Women” traduz aquilo em que acredito. Cada mulher carrega sua própria potência, e a roupa também pode ajudá-la a expressar essa força.</p>
          </blockquote>
          <p>A Nariah é a forma que encontrei de compartilhar um pouco dessa transformação.</p>
          <div class="sign">
            <div class="serif">Nathalia Lagoia</div>
            <small>Fundadora da Nariah Studio</small>
          </div>
        </div>
      </div>
    </section>

    <div class="wrap" aria-hidden="true"><div class="divider"><span></span><img src="fotos/logo--monograma-n-transparente.png" alt=""><span></span></div></div>

    <section id="lovers" class="wrap section" style="padding-top: 40px" aria-labelledby="lovers-title">
      <div class="lovers-card">
        <div>
          <div class="eyebrow"><span class="idx">04</span>Grupo VIP no WhatsApp</div>
          <h2 id="lovers-title">Nariah <em>Lovers</em></h2>
          <p>Para mulheres que treinam, correm e não abrem mão de se sentir bem vestidas depois. No grupo você vê as novidades primeiro e fica sabendo das reposições antes que a sua cor favorita esgote.</p>
          <ul class="perks">
            <li>
              <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></span>
              Acesso antecipado aos lançamentos
            </li>
            <li>
              <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.7L4 15.5M4 20v-4.5h4.5"></path></svg></span>
              Aviso de reposição de estoque das suas peças favoritas
            </li>
            <li>
              <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM21 19v-1a4 4 0 0 0-3-3.9M15.5 3.1a3.5 3.5 0 0 1 0 6.8"></path></svg></span>
              Bastidores da marca e encontros da comunidade
            </li>
          </ul>
          <a class="btn btn--primary" href="https://chat.whatsapp.com/L9t05hl5f0CJKkFgsIHCdQ" target="_blank" rel="noopener noreferrer">
            Quero entrar no grupo
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </a>
          <p style="font-size: 13px; color: #6b615c; margin: 16px 0 0">Grupo gratuito no WhatsApp. Você sai quando quiser.</p>
        </div>
        <div class="lovers-photo">
          <img src="fotos/nariah-lovers--nariah-lovers-frente.jpg" alt="Modelo sorrindo, sentada em uma poltrona, vestindo o Macacão Reto na cor Coral">
        </div>
      </div>

function moldura(rg, ca) {
  var Hd = Math.min(rg.max || 2.7, 1 / (rg.y1 - rg.y0));
  Hd = Math.max(Hd, 1, ca / rg.a);
  var Wd = Hd * rg.a;
  var top = Math.min(0, Math.max(1 - Hd, .5 - ((rg.y0 + rg.y1) / 2) * Hd));
  // Horizontal: the subject always sits in the exact center. If that leaves room
  // on one side, a blurred copy of the same photo fills it (see .fill in the CSS).
  var left = Math.min(0, Math.max(ca - Wd, ca / 2 - rg.cx * Wd));
  return {
    l: (left / ca * 100).toFixed(2) + '%',
    t: (top * 100).toFixed(2) + '%',
    w: (Wd / ca * 100).toFixed(2) + '%',
    h: (Hd * 100).toFixed(2) + '%'
  };
}

// Recorte manual do card (scale + transform-origin em %), sobre a foto em cover 3:4.
function recorteManual(f, r, p) {
  var q = QUADROS[FILE2ID[f.src]];
  var a = (q && q.a) || 2 / 3, ca = 3 / 4;
  var w0 = 100, h0 = 100 * ca / a;
  if (h0 < 100) { h0 = 100; w0 = 100 * a / ca; }
  var reg = r[3] != null ? [r[3]] : q && (q[ENQUADRAMENTOS[p.enquadramento]] || q.inteiro);
  var l0 = (100 - w0) / 2, t0 = (100 - h0) / 2, k = r[0], ox = reg ? reg[0] * 100 : r[1], oy = r[2]; // horizontal: centered on her body
  var w = w0 * k, h = h0 * k;
  var l = Math.min(0, Math.max(100 - w, reg ? 50 - reg[0] * w : ox - (ox - l0) * k));
  var t = Math.min(0, Math.max(100 - h, oy - (oy - t0) * k));
  return { l: l.toFixed(2) + '%', t: t.toFixed(2) + '%', w: w.toFixed(2) + '%', h: h.toFixed(2) + '%' };
}

    build(tpl.content, comp.renderVals(), nodes);
    nodes.forEach(function (n) { frag.appendChild(n); });
    morph(root, frag);
    if (window.__afterRender) window.__afterRender();
  }
  render();
})();
</script>
<script>
// Justified text without big gaps: per paragraph, try tiny letter/word spacing tweaks and keep the most even one.
(function () {
  var SEL = '.hero p.lead,.sec-head p,.about-body p,.pull p,.lovers-card p,.info .desc,.guide p,.soldout';
  var busy = false;
  function score(el) {
    var fs = parseFloat(getComputedStyle(el).fontSize), lh = parseFloat(getComputedStyle(el).lineHeight) || fs * 1.6,
      lastTop = el.getBoundingClientRect().bottom - lh, m = 0, w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), n, r = document.createRange();
    while ((n = w.nextNode())) {
      for (var i = 0; i < n.data.length; i++) {
        if (n.data[i] !== ' ') continue;
        r.setStart(n, i); r.setEnd(n, i + 1);
        var b = r.getBoundingClientRect();
        if (!b.width || b.top >= lastTop - 2) continue; // the last line is never stretched
        m = Math.max(m, b.width);
      }
    }
    return m / fs;
  }
  function fit() {
    if (busy) return; busy = true;
    document.querySelectorAll(SEL).forEach(function (el) {
      var key = el.clientWidth + '|' + (document.fonts ? document.fonts.status : '') + '|' + el.textContent;
      if (el.__fitKey === key) return; // unchanged: leave it alone (no reflow while a drawer opens)
      el.__fitKey = key;
      el.style.textAlign = '';
      if (getComputedStyle(el).textAlign !== 'justify') return;
      var best = null, tries = [[0, 0], [-0.01, 0], [0.01, 0], [-0.02, -0.04], [0.02, 0], [-0.015, 0.02], [0.015, -0.04], [-0.025, 0], [0.025, 0], [-0.03, -0.05], [0.03, 0]];
      for (var t = 0; t < tries.length; t++) {
        el.style.letterSpacing = tries[t][0] + 'em'; el.style.wordSpacing = tries[t][1] + 'em';
        var sc = score(el);
        if (!best || sc < best.s) best = { s: sc, t: tries[t] };
        if (sc < 0.5) break;
      }
      el.style.letterSpacing = best.t[0] + 'em'; el.style.wordSpacing = best.t[1] + 'em';
      if (best.s > 1.6) { // no spacing removes the hole: align this one paragraph left instead
        el.style.letterSpacing = ''; el.style.wordSpacing = ''; el.style.textAlign = 'left';
      }
    });
    busy = false;
  }
  var timer;
  function later() { clearTimeout(timer); timer = setTimeout(fit, 120); }
  window.__afterRender = later;
  window.addEventListener('resize', later);
  if (document.fonts) document.fonts.ready.then(later);
  later();
})();
// Entrance animations hold their last frame forever (fill: both), which keeps the element on its own
// GPU layer and softens text and icons. Once one finishes, drop it: the base style is the same final state.
(function () {
  var ENTRADA = { fadeUp: 1, fadeDown: 1, lineUp: 1, settle: 1, fade: 1 };
  document.addEventListener('animationend', function (e) {
    if (!ENTRADA[e.animationName] || !e.target.getAnimations) return;
    e.target.getAnimations().forEach(function (a) { if (a.animationName === e.animationName && a.timeline === document.timeline) a.cancel(); });
  });
})();
</script>
<script>
// Zoom on the product photo (desktop only): one click zooms in and follows the mouse, another click returns.
// State lives on <html>, which the renderer never rewrites, so re-renders don't reset it.
(function () {
  var H = document.documentElement;
  if (matchMedia('(pointer: coarse)').matches) return;
  function aim(st, x, y) {
    var r = st.getBoundingClientRect();
    H.style.setProperty('--zx', Math.max(0, Math.min(100, (x - r.left) / r.width * 100)) + '%');
    H.style.setProperty('--zy', Math.max(0, Math.min(100, (y - r.top) / r.height * 100)) + '%');
  }
  document.addEventListener('click', function (e) {
    var t = e.target, st = t.closest && t.closest('.stage');
    if (st && !t.closest('button, a, .thumbs')) {
      if (H.hasAttribute('data-zoom')) H.removeAttribute('data-zoom');
      else { aim(st, e.clientX, e.clientY); H.setAttribute('data-zoom', ''); }
    } else if (t.closest && t.closest('.stage button, .thumbs, .swatches, .overlay, .drawer-top button')) H.removeAttribute('data-zoom');
  });
  document.addEventListener('mousemove', function (e) {
    if (!H.hasAttribute('data-zoom')) return;
    var st = e.target.closest && e.target.closest('.stage'); if (st) aim(st, e.clientX, e.clientY);
  });
  var prev = window.__afterRender, lastSrc = '';
  window.__afterRender = function () {
    if (prev) prev();
    var img = document.querySelector('.stage img.main');
    if (!img) { H.removeAttribute('data-zoom'); lastSrc = ''; return; }
    if (img.getAttribute('src') !== lastSrc) { H.removeAttribute('data-zoom'); lastSrc = img.getAttribute('src'); }
  };
})();
</script>
